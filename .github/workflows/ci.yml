name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # Fast-fail gate: builds every non-mobile project in one shot (App.csproj and
      # AppAndroidOnly.csproj are excluded via the filter -- they need Android/iOS/MacCatalyst
      # workloads this runner doesn't have) so a break anywhere, including in projects no test
      # job builds on its own (e.g. GT4.Tools.RelativesCli), is caught immediately. Runs
      # independently of the test/test-device jobs below -- they keep restoring/building their
      # own project so the concurrency from #38 is unaffected.
      - name: Build solution
        run: dotnet build GT4.CI.slnf --configuration Release

      # AppWinOnly and GT4.UI.App.DeviceTests both conditionally target
      # net10.0-windows10.0.19041.0 in addition to other TFMs, so they're split into their own
      # filter and built with --framework: an unscoped build of DeviceTests here would also compile
      # its net10.0-android TFM, which nothing in CI tests (android device tests only run on
      # physical hardware) and which just slows this gate down.
      - name: Build solution (windows)
        run: dotnet build GT4.CI.Windows.slnf --configuration Release --framework net10.0-windows10.0.19041.0

  test:
    runs-on: windows-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        include:
          - project: Tests\GT4.Core.Project.Tests\GT4.Core.Project.Tests.csproj
            name: core-project
          - project: Tests\GT4.UI.Utils.Tests\GT4.UI.Utils.Tests.csproj
            name: ui-utils
          - project: Tests\GT4.UI.View.Tests\GT4.UI.View.Tests.csproj
            name: ui-view
          - project: Tests\GT4.Core.Gedcom.Tests\GT4.Core.Gedcom.Tests.csproj
            name: core-gedcom
          # The GEDCOM round-trip comparer lives here; the functional script that drives it needs the
          # separate gedcom-samples repository and so stays local-only (run-tests-coverage.ps1).
          - project: Tests\GT4.Tools.RelativesCli.Tests\GT4.Tools.RelativesCli.Tests.csproj
            name: tools-relatives-cli

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Build
        run: dotnet build ${{ matrix.project }} --configuration Release

      - name: Test
        run: dotnet test ${{ matrix.project }} --no-build --configuration Release --logger "trx;LogFileName=${{ matrix.name }}.trx" --collect "XPlat Code Coverage" --results-directory coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-${{ matrix.name }}
          path: coverage

  test-device:
    runs-on: windows-latest
    timeout-minutes: 10

    # The teardown race below scales with how long one attempt runs, so the suite is halved and each
    # half retries on its own budget: a crash costs one shard's attempt instead of the whole run.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # Debug is unsupported for this project (see the note in its .csproj); must build/run Release.
      # No code coverage: the tests execute inside a separately-launched .exe that DeviceRunners
      # spawns and talks to over TCP, so coverlet's in-process collector never sees it.
      # run-tests-coverage.ps1 (local) does capture this via dotnet-coverage's process-tree attach
      # instead -- expect AppWinOnly's coverage numbers here to permanently differ from a local run.
      - name: Build GT4.UI.App.DeviceTests
        run: dotnet build Tests\GT4.UI.App.DeviceTests\GT4.UI.App.DeviceTests.csproj --configuration Release --framework net10.0-windows10.0.19041.0

      - name: Test GT4.UI.App.DeviceTests (shard ${{ matrix.shard }})
        # The DeviceRunners CLI can exit non-zero from a native WinUI teardown race -- the spawned
        # test-host process dying, sometimes after every test already passed, sometimes mid-run -- and
        # the exact symptom varies (a window-class unregister failure, a reset TCP link, ...). The two
        # cases are told apart by the runner's own "Test run complete." line, which it prints only once
        # the whole run has ended: with it, every test ran and a bad exit code is the host failing to
        # exit, so the attempt is accepted; without it the run was cut short and is retried. A TRX with
        # any failed test is a real failure and is never retried past.
        run: |
          # Shard 1 is these classes and shard 2 is the complement, so a class added later always runs
          # in shard 2 rather than silently going untested -- the split can drift in balance, never in
          # coverage. Matching on "DeviceTests.<class>." keeps a name from also matching a longer one.
          # The classes that attach a page to the runner's Window are spread across both halves rather
          # than piled into one: they are where the host dies, and a shard made entirely of them fails
          # every attempt. Balanced at 172 tests here, 165 there.
          $shardOne = @(
            'ProjectPageTests', 'PersonPageTests', 'NamesPageTests', 'SelectNameDialogTests',
            'PhotoViewerDialogTests', 'RelativeInfoViewTests', 'GedcomDataConverterTests',
            'SelectDateDialogTests', 'FamilyTreeNodeViewTests', 'RelativeRowTests',
            'FamilyTreeConnectorShapeTests', 'RelativeRowViewTests'
          )
          $shard = '${{ matrix.shard }}'
          if ($shard -eq '1') {
            $filter = ($shardOne | ForEach-Object { "FullyQualifiedName~DeviceTests.$_." }) -join '|'
          } else {
            $filter = ($shardOne | ForEach-Object { "FullyQualifiedName!~DeviceTests.$_." }) -join '&'
          }

          # dotnet test creates this for the TRX, but the console log is tee'd into it from the very
          # first line of the run, before that happens.
          New-Item -ItemType Directory -Force -Path coverage | Out-Null

          $maxAttempts = 3
          $success = $false
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "=== Device test shard $shard attempt $attempt of $maxAttempts ==="
            $trxPath = "coverage\device-tests-$shard.trx"
            if (Test-Path $trxPath) { Remove-Item $trxPath -Force }
            $logPath = "coverage\device-tests-$shard.log"

            & dotnet test Tests\GT4.UI.App.DeviceTests\GT4.UI.App.DeviceTests.csproj --no-build --configuration Release --framework net10.0-windows10.0.19041.0 --filter $filter --logger "trx;LogFileName=device-tests-$shard.trx" --results-directory coverage 2>&1 | Tee-Object -FilePath $logPath
            $exitCode = $LASTEXITCODE
            $ranToCompletion = Select-String -Path $logPath -Pattern 'Test run complete\.' -Quiet

            if (Test-Path $trxPath) {
              [xml]$trx = Get-Content $trxPath
              $failed = [int]$trx.TestRun.ResultSummary.Counters.failed
              $total = [int]$trx.TestRun.ResultSummary.Counters.total
              Write-Host "Attempt $attempt`: $total total, $failed failed (exit code $exitCode, ran to completion: $ranToCompletion)."

              if ($failed -gt 0) {
                Write-Host "Real test failure recorded -- not retrying."
                exit 1
              }
            } else {
              Write-Host "Attempt $attempt`: no TRX produced (exit code $exitCode, ran to completion: $ranToCompletion)."
            }

            if ($exitCode -eq 0) {
              $success = $true
              break
            }

            if ($ranToCompletion -and (Test-Path $trxPath)) {
              Write-Host "::warning::Device test shard $shard exited $exitCode after the run had already completed with no failures -- the host died on its way out, accepting the attempt."
              $success = $true
              break
            }

            if ($attempt -lt $maxAttempts) {
              Write-Host "::warning::Device test shard $shard attempt $attempt exited non-zero (exit code $exitCode) with no failed tests recorded -- retrying."
            }
          }

          if (-not $success) {
            Write-Host "Device test shard $shard did not complete cleanly after $maxAttempts attempts."
            exit 1
          }
          exit 0

      - name: Upload device test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-device-${{ matrix.shard }}
          # The console log travels with the TRX: which of the two teardown deaths happened is only
          # visible there, and the TRX of an accepted attempt looks like any other passing run.
          path: |
            coverage\device-tests-${{ matrix.shard }}.trx
            coverage\device-tests-${{ matrix.shard }}.log

  coverage-report:
    needs: [test, test-device]
    if: always()
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Download coverage artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage
          merge-multiple: true

      - name: Download device test results
        uses: actions/download-artifact@v8
        with:
          pattern: test-results-device-*
          merge-multiple: true
          path: coverage

      - name: Generate coverage report
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator -reports:coverage/**/coverage.cobertura.xml -targetdir:coverage/report -reporttypes:Html

      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: coverage/report

      - name: Upload test results
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: coverage/*.trx
