name: Close fixed issues

# GitHub closes the issues a PR body names with a closing keyword only when the PR merges into the
# default branch, so a PR merged into a feature branch would leave them open until the feature lands.
on:
  pull_request_target:
    types: [closed]

permissions:
  issues: write

jobs:
  close:
    if: github.event.pull_request.merged && github.event.pull_request.base.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest

    steps:
      - name: Close the issues the PR body fixes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          $pattern = '(?i)\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?):?\s+#(\d+)\b'
          $issues = [regex]::Matches("$env:PR_BODY", $pattern) | ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique
          foreach ($issue in $issues) {
            $isPullRequest = gh api "repos/$env:REPO/issues/$issue" --jq 'has("pull_request")'
            if ($isPullRequest -eq 'true') {
              continue
            }
            gh issue close $issue --repo $env:REPO --reason completed --comment "Fixed by #$env:PR_NUMBER, merged into $env:BASE_REF."
          }
